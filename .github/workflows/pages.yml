# Publica la web de Clay-Myrrh en GitHub Pages: site/ + el icono + la demo en vivo de los componentes.
# Requisito (una sola vez): Settings → Pages → Build and deployment → Source: «GitHub Actions».
name: Página web

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "localai/webkit/**"
      - "localai/assets/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Montar la página
        run: |
          mkdir -p _site/assets
          cp -r site/. _site/
          cp localai/assets/clay-myrrh.svg localai/assets/clay-myrrh.png localai/assets/clay-myrrh.ico _site/assets/
          # demo en vivo de los componentes (solo usa la biblioteca estándar de Python)
          python -c "from pathlib import Path; from localai import webkit; r = webkit.build_demo(Path('_site/demo')); print(len(r.components), 'componentes;', 'avisos:', r.warnings or 'ninguno')"
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
